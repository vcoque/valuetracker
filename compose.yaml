# ValueTracker development toolchain.
#
#   ./scripts/check-env.sh --init-env    write the .env this file interpolates
#   ./scripts/dev.sh npm test            run a command in the toolchain
#   docker compose up -d                 background database + toolchain
#
# HOST_UID/HOST_GID/DOCKER_GID differ per machine, so they come from .env,
# which is gitignored and generated by scripts/check-env.sh.
name: valuetracker

services:
  app:
    build:
      context: .
      # Build-time only. BuildKit copies the host's /etc/resolv.conf into the
      # build's own network namespace verbatim; where that points at
      # systemd-resolved's 127.0.0.53 stub, the loopback address is meaningless
      # there and every apt lookup fails to resolve. Sharing the host namespace
      # for the build makes the stub reachable. Runtime networking below is
      # unaffected -- the container still gets its own namespace.
      network: host
    init: true
    # Run as the host user, so files created in the bind mount below come out
    # owned by the developer rather than by root.
    user: "${HOST_UID:?run ./scripts/check-env.sh --init-env}:${HOST_GID:?run ./scripts/check-env.sh --init-env}"
    group_add:
      # The host's docker group, so the socket mounted below is readable.
      - "${DOCKER_GID:?run ./scripts/check-env.sh --init-env}"
    volumes:
      # The whole repo, node_modules included. Host and container are both
      # linux/amd64 and the host's glibc is the newer of the two, so packages
      # installed in here stay readable by host tooling -- which keeps the
      # editor's TypeScript server and ESLint working with no host install.
      - .:/workspace
      - npm-cache:/home/node/.npm
      # Testcontainers drives the host daemon directly (docker-outside-of-
      # docker). The containers it starts are siblings of this one, not
      # children, which is why the socket is shared rather than nested.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Those siblings publish their mapped ports on the host, not inside this
      # container's network namespace, so Testcontainers has to dial back out
      # through the gateway. TESTCONTAINERS_HOST_OVERRIDE below tells it to.
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://valuetracker:valuetracker@db:5432/valuetracker
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    # SPEC.md requires PostgreSQL 16+; integration tests get their own throwaway
    # instance from Testcontainers, so this one serves the dev loop only.
    image: postgres:17-alpine
    # Local development credentials. These are not secrets and deliberately not
    # treated as such -- a deployed database reads its credentials from the
    # environment, never from a file in the repository.
    environment:
      POSTGRES_USER: valuetracker
      POSTGRES_PASSWORD: valuetracker
      POSTGRES_DB: valuetracker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuetracker -d valuetracker"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  npm-cache:
  pgdata:
