# ValueTracker -- DEVELOPMENT environment.
#
# Deliberately not named compose.yaml: Compose would then load it implicitly and
# `docker compose up` in this directory would silently mean "development". Every
# invocation must name the environment it is acting on. Use the wrappers, which
# pass the right files:
#
#   ./scripts/check-env.sh --init-env    write .env.dev.local for this machine
#   ./scripts/check-env.sh --full        verify the toolchain
#   ./scripts/dev.sh npm test            run a command in the toolchain
#
# Or explicitly, which is what those wrappers do:
#
#   docker compose -f compose-dev.yaml \
#     --env-file .env.dev --env-file .env.dev.local <command>
#
# Configuration comes from those two files, never from defaults inlined here:
#   .env.dev        committed, shared, non-secret development configuration
#   .env.dev.local  gitignored, per-machine values (uid/gid, docker group)
#
# Every interpolation below uses ${VAR:?...} rather than ${VAR:-default}, so a
# missing value fails loudly instead of silently substituting something that
# happens to work on one machine.
name: ${COMPOSE_PROJECT_NAME:?missing .env.dev -- see the header of this file}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:?set NODE_IMAGE in .env.dev}
      # Build-time only. BuildKit copies the host's /etc/resolv.conf into the
      # build's own network namespace verbatim; where that points at
      # systemd-resolved's 127.0.0.53 stub, the loopback address is meaningless
      # there and every apt lookup fails to resolve. Sharing the host namespace
      # for the build makes the stub reachable. Runtime networking is
      # unaffected -- the container still gets its own namespace below.
      network: host
    init: true
    # Run as the host user, so files created in the bind mount below come out
    # owned by the developer rather than by root.
    user: "${HOST_UID:?run ./scripts/check-env.sh --init-env}:${HOST_GID:?run ./scripts/check-env.sh --init-env}"
    group_add:
      # The host's docker group, so the socket mounted below is readable.
      - "${DOCKER_GID:?run ./scripts/check-env.sh --init-env}"
    volumes:
      # The whole repo, node_modules included. Host and container are both
      # linux/amd64 and the host's glibc is the newer of the two, so packages
      # installed in here stay readable by host tooling -- which keeps the
      # editor's TypeScript server and ESLint working with no host install.
      - .:/workspace
      - npm-cache:/home/node/.npm
      # Testcontainers drives the host daemon directly (docker-outside-of-
      # docker). The containers it starts are siblings of this one, not
      # children, which is why the socket is shared rather than nested.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Those siblings publish their mapped ports on the host, not inside this
      # container's network namespace, so Testcontainers has to dial back out
      # through the gateway. TESTCONTAINERS_HOST_OVERRIDE below tells it to.
      - "host.docker.internal:host-gateway"
    environment:
      # Assembled from the parts rather than stored whole, so the credentials
      # below and the ones the database is created with cannot drift apart.
      # The port is the in-network one and is always 5432; POSTGRES_HOST_PORT
      # only governs what is published to the host.
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      TESTCONTAINERS_HOST_OVERRIDE: ${TESTCONTAINERS_HOST_OVERRIDE:?set in .env.dev}
      NODE_ENV: ${NODE_ENV:?set NODE_ENV in .env.dev}
      # The integration harness starts its own throwaway database and builds it
      # from this same image, so the version tests run against and the version
      # development runs against cannot drift apart. A constraint that holds on
      # one PostgreSQL and not the other is precisely the bug the real-database
      # test strategy exists to catch.
      POSTGRES_IMAGE: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE in .env.dev}
    ports:
      - "${APP_HOST_PORT:?set APP_HOST_PORT in .env.dev}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    # The development database, for the dev loop and migrations. Integration
    # tests never touch it -- Testcontainers gives each run its own throwaway
    # instance -- so a test run cannot corrupt development data.
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE in .env.dev}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "${POSTGRES_HOST_PORT:?set POSTGRES_HOST_PORT in .env.dev}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  npm-cache:
  pgdata:
